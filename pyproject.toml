[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eqtheory"
version = "0.3.1"
description = "Equational theories over magmas: term rewriting with a Knuth-Bendix order, proof-producing e-graphs, goal-directed superposition, finite and infinite countermodels, Lean 4 certificates."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Oliver Sick"}]
keywords = ["equational theories", "magma", "term rewriting", "e-graph", "superposition", "Lean 4", "SAT"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
viz = ["graphviz>=0.20"]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
eqtheory = "eqtheory.cli:main"

[tool.setuptools.packages.find]
include = ["eqtheory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
