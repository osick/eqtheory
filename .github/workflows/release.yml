name: Release

# Triggered by an annotated tag `vX.Y.Z` (see docs/releasing.md).
# Publishing to PyPI uses trusted publishing: register the project on
# PyPI with owner `osick`, repo `eqtheory`, workflow `release.yml`,
# environment `pypi` — no API token is stored in the repository.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches pyproject
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject v$v"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract this version's changelog section
        run: |
          awk -v tag="${GITHUB_REF_NAME#v}" '
            /^## / { on = index($0, tag) > 0; if (on) next }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release ${GITHUB_REF_NAME}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
